[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
mtr-core = { path = "crates/mtr-core" }
mtr-instrument = { path = "crates/mtr-instrument" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
